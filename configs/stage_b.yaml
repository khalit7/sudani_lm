# Stage B — the main Arabic pretraining run (plan.md Part III).
#
# 110M parameters, 5B tokens.
#
# Measured on 2x RTX 5090: ~325k tokens/s at batch 16, so 5B tokens takes roughly 4.3 hours.

run:
  project_name: "sudani_llm_pretraining"
  run_name: "stage_b_110m"
  run_description: "main Arabic pretraining: 110M params, 5B tokens, packed v2 corpus"

model:
  name: "init_decoder"
  config:
    d_model: 768
    num_layers: 12
    num_heads: 12
    max_seq_len: 1024
    dropout: 0.0
    tie_embeddings: True

train:
  seed: 67
  block_size: 1024

  # 2 GPUs x 16 x 1024 x 16 accum = 524,288 tokens/step.
  # Peak memory at batch 16 is 13.1 GB of 31.4 GB, leaving room for DDP's gradient buckets.
  micro_batch_size: 16
  grad_accum: 16
  max_steps: 9500           # 9500 x 524,288 = 4.98B tokens

  bf16: True
  compile: True             # falls back to eager automatically if the toolchain is unavailable
  grad_clip: 1.0

  optimiser:
    name: "adamw"
    config:
      lr: 0.0006
      betas: [0.9, 0.95]
      eps: 1.0e-8
      weight_decay: 0.1

  scheduler:
    warmup_percentage: 0.02   # ~190 steps
    min_lr_ratio: 0.1

  dataloader:
    stage: "pretrain"

  val_batch_size: 16
  val_max_batches: 200
  eval_every: 500
  checkpoint_every: 250     # a crash costs at most ~7 minutes of compute
  log_every: 20

  peak_flops_per_gpu: 2.39e+14

monitor:
  grad_norm:
    freq: 50
