# Ablation: does locally-generated Gemma synthetic data help? (owner-requested 2026-08-27)
#
# Control = stage_c_abl_a (acquisitions only; metrics recorded in plan.md). This arm adds ONE
# ingredient: QC-passed monologues generated by gemma3/gemma4 (monologue_gemma.jsonl, derived
# from the rendered pool by generator). Same recipe, same ~3-epoch schedule. Synthetic is
# never upsampled (plan.md binding rule).
#
# Gate: Sudanese metrics (chat-holdout, Flores-Sud, Lisan) not worse than control, MMLU/MSA
# within guard — a pass green-lights the larger local generation batch.
#
#   python -m src.preprocessing.pack manifest configs/mixtures/stage_c_abl_gemma.yaml

stage: stage_c_abl_gemma

sources:
  - {path: data/interim/whatsapp/train.jsonl, name: whatsapp, repeat: 1}
  - {path: data/interim/sudani/all.jsonl, name: sudani, repeat: 3}
  - {path: data/interim/oddadmix/train.jsonl, name: oddadmix, repeat: 2}
  - {path: data/interim/lyrics/train.jsonl, name: lyrics, repeat: 1}
  - {path: data/interim/synthetic/monologue_gemma.jsonl, name: syn_gemma_mono, repeat: 1}

arabic_replay: 0.4

val_sources:
  - {path: data/interim/whatsapp/val.jsonl, name: whatsapp}
  - {path: data/interim/oddadmix/val.jsonl, name: oddadmix}
  - {path: data/interim/lyrics/val.jsonl, name: lyrics}
